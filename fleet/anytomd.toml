# Maintenance contract of edamlabs/anytomd (moved from damvolkov/anytomd on 2026-10-26).
repo = "edamlabs/anytomd"
kind = "lib"
family = "binding"
modules = ["deps", "security", "drift", "release", "upstream", "docs", "community"]

[deps]
lockfiles = ["uv.lock", "Cargo.lock"]

[[deps.watch]]
name = "anytomd-rs"
repo = "https://github.com/developer0hye/anytomd-rs"
registry = "https://crates.io/crates/anytomd"
license = "Apache-2.0"

[[deps.watch]]
name = "pyo3"
repo = "https://github.com/PyO3/pyo3"
registry = "https://crates.io/crates/pyo3"
license = "MIT OR Apache-2.0"

[[deps.watch]]
name = "tokio"
repo = "https://github.com/tokio-rs/tokio"
registry = "https://crates.io/crates/tokio"
license = "MIT"

### The OCR engine linked into the wheel since 1.5.0: oar-ocr pins ort exactly, ort pins the ONNX Runtime it downloads.
[[deps.watch]]
name = "oar-ocr"
repo = "https://github.com/GreatV/oar-ocr"
registry = "https://crates.io/crates/oar-ocr"
license = "Apache-2.0"

[[deps.watch]]
name = "ort"
repo = "https://github.com/pykeio/ort"
registry = "https://crates.io/crates/ort"
license = "MIT OR Apache-2.0"

[upstream]

[[upstream.engines]]
name = "anytomd"
registry = "https://crates.io/crates/anytomd"
parity = "1.3.1"
