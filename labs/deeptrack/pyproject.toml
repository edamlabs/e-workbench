##### BUILD #####
[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

##### PROJECT #####
[project]
name = "deeptrack"
version = "0.0.0"
description = "Lab: an insurance deep agent over an ontology MCP, traced live and in Langfuse."
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "ag-ui-langgraph[fastapi]>=0.0.47",
    "e-serde>=0.6.2",
    "e-track[langgraph,otel,topology,viewer]>=0.4.0",
    "anyio>=4.6",
    "beartype>=0.22.9",
    "cyclopts>=4.25.3",
    "deepagents>=0.7.32",
    "granian[reload]>=2.8",
    "langchain>=1.0",
    "langchain-google-genai>=4.4.2",
    "langchain-mcp-adapters>=0.2",
    "langfuse>=5.1",
    "langgraph>=1.2.19",
    "litestar>=2.18",
    "msgspec>=0.21",
    "pydantic>=2.6",
    "pydantic-settings>=2.6",
    "rich>=14.0",
    "structlog>=26.1",
]

[project.scripts]
deeptrack = "main:main"

[dependency-groups]
dev = [
    "numpy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-timeout>=2.4",
    "ruff>=0.16",
    "tach>=0.35",
    "ty>=0.0.75",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
### the house sections (vendored from e-arkhetypo common, trimmed) and the lab's own package.
packages = ["src/api", "src/engines", "src/infra", "src/logic", "src/models", "src/ops", "src/ports", "src/providers", "src/services", "src/tools"]

[tool.hatch.build.targets.wheel.force-include]
"src/main.py" = "main.py"

##### LINT #####
[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "T20", "EM", "ISC",
    "PIE", "PT", "RET", "SIM", "TID", "TC", "ARG", "PTH", "PL", "PERF", "FURB",
    "ASYNC", "S", "BLE", "FBT", "LOG", "G", "RUF",
]
ignore = ["E501", "ISC001", "PLR0913", "TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "PLR2004", "ARG", "FBT"]
### LangChain's callback protocol fixes these signatures: unused arguments are the contract.

[tool.ruff.lint.isort]
known-first-party = ["api", "engines", "infra", "logic", "main", "models", "ops", "ports", "providers", "services", "tests", "tools"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

##### TYPES #####
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

##### TEST #####
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "-m", "not integration and not llm"]
pythonpath = ["."]
strict = true
timeout = "60"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the stack up (make stack): ontoref, ontoval, Langfuse",
    "llm: calls the real model (Gemini API key in the repo-root .env) — costs tokens, varies run to run",
    "evaluation: the agents judged on held-out cases, k runs each (make eval) — real model and stack",
]
