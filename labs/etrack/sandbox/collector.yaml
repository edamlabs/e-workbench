##### THE SANDBOX COLLECTOR — OTLP/HTTP in, one JSON line per export out, nothing else #####
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  file/traces:
    path: /out/traces.jsonl
    flush_interval: 100ms
  file/logs:
    path: /out/logs.jsonl
    flush_interval: 100ms

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file/traces]
    logs:
      receivers: [otlp]
      exporters: [file/logs]
