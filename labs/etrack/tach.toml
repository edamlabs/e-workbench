##### ROOTS #####
source_roots = ["src"]
exclude = ["tests", "docs"]

##### RULES #####
forbid_circular_dependencies = true
### the import table of the taxonomy, edge by edge: an import that is not an edge fails. `exact` stays off because the
### table declares what a layer MAY import; the graph itself — no edge between processors, drivers and adapters, none
### upward — is what the gate holds.
exact = false
root_module = "forbid"

[rules]
unused_ignore_directives = "error"

##### MODULES #####
### the public surface: the tracker composes a fold over the channel and a source port.
[[modules]]
path = "etrack.logic"
depends_on = ["etrack.processors", "etrack.ports", "etrack.models", "etrack.infra", "etrack.infra.errors"]

### the execution level: each stands on ports, models, infra and ops; none lists another.
[[modules]]
path = "etrack.processors"
depends_on = ["etrack.ports", "etrack.models", "etrack.infra", "etrack.infra.errors", "etrack.ops"]

[[modules]]
path = "etrack.providers.drivers"
depends_on = ["etrack.ports", "etrack.models", "etrack.infra", "etrack.infra.errors", "etrack.ops"]

[[modules]]
path = "etrack.providers.adapters"
depends_on = ["etrack.ports", "etrack.models", "etrack.infra", "etrack.infra.errors", "etrack.ops"]

### ports are the bottleneck of the import graph: they see the contracts and nothing else.
[[modules]]
path = "etrack.ports"
depends_on = ["etrack.models"]

### the record is the floor of the contracts: it imports nothing first-party.
[[modules]]
path = "etrack.models"
depends_on = []

[[modules]]
path = "etrack.infra"
depends_on = ["etrack.ops", "etrack.infra.errors"]

### the error tree is the floor of the package: every module raises from it and it imports nothing.
[[modules]]
path = "etrack.infra.errors"
depends_on = []

[[modules]]
path = "etrack.ops"
depends_on = ["etrack.infra.errors"]
