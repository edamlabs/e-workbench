# Import contracts: dependencies point inward. (models, ops) ← logic ← (adapters, core) ← cli.
source_roots = ["src"]
exclude = ["tests"]
forbid_circular_dependencies = true
exact = true
root_module = "forbid"

[rules]
unused_ignore_directives = "error"

[[modules]]
path = "e_workbench"
depends_on = ["e_workbench.cli"]

[[modules]]
path = "e_workbench.models"
depends_on = []

[[modules]]
path = "e_workbench.ops"
depends_on = []

[[modules]]
path = "e_workbench.logic"
depends_on = ["e_workbench.models", "e_workbench.ops"]

[[modules]]
path = "e_workbench.adapters"
depends_on = ["e_workbench.models"]

[[modules]]
path = "e_workbench.core"
depends_on = ["e_workbench.adapters", "e_workbench.logic"]

[[modules]]
path = "e_workbench.cli"
depends_on = ["e_workbench.core", "e_workbench.logic", "e_workbench.models"]
